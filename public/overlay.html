<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mahjong Soul Overlay</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: var(--font); font-size: var(--size); color: var(--text); padding: 12px; }
  .panel { background: var(--bg); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; width: max-content; min-width: 280px; box-shadow: 0 4px 16px #0006; }
  .round { font-weight: 700; color: var(--accent); }
  .round small { color: var(--text); opacity: .75; font-weight: 400; margin-left: 8px; font-size: .75em; }
  .players { display: grid; grid-template-columns: auto auto; gap: 2px 18px; margin-top: 6px; }
  .players .score { text-align: right; font-variant-numeric: tabular-nums; }
  .me { color: var(--accent); font-weight: 700; }
  .badge { background: var(--riichi); color: #001; border-radius: 4px; padding: 0 5px; font-size: .65em; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .session { font-size: .8em; opacity: .9; }
  #feed { display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--bg); border-left: 5px solid var(--accent); border-radius: 10px; padding: 8px 14px; width: max-content; max-width: 560px; animation: pop .35s ease-out; box-shadow: 0 4px 16px #0006; }
  .toast.win { border-color: var(--win); } .toast.loss { border-color: var(--loss); } .toast.riichi { border-color: var(--riichi); }
  .toast.big { font-size: 1.4em; font-weight: 800; }
  .toast.out { animation: fade .5s forwards; }
  @keyframes pop { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { to { opacity: 0; transform: translateX(-20px); } }
  .hidden { display: none; }
</style>
</head>
<body>
  <div id="state" class="panel hidden">
    <div class="round" id="round"></div>
    <div class="players" id="players"></div>
  </div>
  <div id="session" class="panel session hidden"></div>
  <div id="feed"></div>
<script>
  // Optional URL params: ?only=feed|scores|session  to place widgets as separate OBS sources.
  const only = new URLSearchParams(location.search).get('only');
  let opts = {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = (key, flag) => (!only || only === key) && flag;

  function theme(t) {
    const r = document.documentElement.style;
    r.setProperty('--font', t.fontFamily); r.setProperty('--size', t.fontSize + 'px'); r.setProperty('--text', t.text);
    r.setProperty('--bg', t.background); r.setProperty('--accent', t.accent); r.setProperty('--win', t.win);
    r.setProperty('--loss', t.loss); r.setProperty('--riichi', t.riichi);
  }

  function renderState(s) {
    const showScores = show('scores', opts.showScores || opts.showRound) && s.players.length;
    $('state').classList.toggle('hidden', !showScores);
    $('round').classList.toggle('hidden', !opts.showRound);
    $('players').classList.toggle('hidden', !opts.showScores);
    const extras = [s.honba ? `${s.honba} honba` : '', s.riichiSticks ? `${s.riichiSticks} riichi stick${s.riichiSticks > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');
    $('round').innerHTML = `${esc(s.inGame ? (s.round || 'Starting…') : 'Last game')}<small>${esc(extras)}</small>`;
    $('players').innerHTML = s.players.map((p) => {
      const me = opts.highlightMe && p.seat === s.mySeat ? 'me' : '';
      const riichi = s.riichi.includes(p.seat) ? '<span class="badge">RIICHI</span>' : '';
      return `<div class="${me}">${esc(p.nickname)}${riichi}</div><div class="score ${me}">${p.score ?? ''}</div>`;
    }).join('');
    const ss = s.session;
    $('session').classList.toggle('hidden', !show('session', opts.showSession));
    $('session').textContent = `Session: ${ss.games} games · avg ${ss.avgPlace} · ${ss.first}/${ss.second}/${ss.third}/${ss.fourth}`;
  }

  const STYLE = { win_tsumo: 'win', win_ron: 'win', yakuman: 'win big', dealt_in: 'loss', riichi: 'riichi', game_end: '' };
  function toast(key, text, ev) {
    if (!show('feed', opts.showFeed) || !text) return;
    let cls = STYLE[key] ?? '';
    if (key === 'game_end') cls = ev.myPlace === 1 ? 'win big' : ev.myPlace === ev.playerCount ? 'loss' : '';
    const t = document.createElement('div');
    t.className = 'toast ' + cls; t.textContent = text;
    $('feed').prepend(t);
    while ($('feed').children.length > opts.feedMax) $('feed').lastChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 500); }, opts.feedSeconds * 1000);
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/overlay`);
    ws.onmessage = (m) => {
      const d = JSON.parse(m.data);
      if (d.kind === 'state') { opts = d.overlay; theme(opts.theme); renderState(d.state); }
      else if (d.kind === 'event') toast(d.key, d.text, d.event);
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
</script>
</body>
</html>
