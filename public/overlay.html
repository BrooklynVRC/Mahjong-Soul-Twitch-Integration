<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mahjong Soul Overlay</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: var(--font); font-size: var(--size); color: var(--text); padding: 12px; }
  .panel { background: var(--bg); border-radius: 12px; padding: 10px 16px; margin-bottom: 10px; width: max-content; min-width: 240px; box-shadow: 0 4px 16px #0006; }
  .status .mode { font-weight: 700; color: var(--accent); }
  .status .line { display: flex; gap: 14px; align-items: baseline; margin-top: 2px; }
  .place { font-size: 1.6em; font-weight: 800; }
  .place.p1 { color: var(--win); } .place.p4 { color: var(--loss); }
  .muted { opacity: .75; font-size: .8em; }
  .session { font-size: .8em; opacity: .95; }
  #feed { display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--bg); border-left: 5px solid var(--accent); border-radius: 10px; padding: 8px 14px; width: max-content; max-width: 560px; animation: pop .35s ease-out; box-shadow: 0 4px 16px #0006; }
  .toast.win { border-color: var(--win); } .toast.loss { border-color: var(--loss); } .toast.riichi { border-color: var(--riichi); }
  .toast.big { font-size: 1.4em; font-weight: 800; }
  .toast.out { animation: fade .5s forwards; }
  @keyframes pop { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { to { opacity: 0; transform: translateX(-20px); } }
  .hidden { display: none; }
</style>
</head>
<body>
  <div id="status" class="panel status hidden">
    <div class="mode" id="mode"></div>
    <div class="line"><span class="place" id="place"></span><span class="muted" id="time"></span></div>
  </div>
  <div id="session" class="panel session hidden"></div>
  <div id="feed"></div>
<script>
  // Optional URL params: ?only=status|feed|session  to place widgets as separate OBS sources.
  const only = new URLSearchParams(location.search).get('only');
  let opts = {}, last = null;
  const $ = (id) => document.getElementById(id);
  const show = (key, flag) => (!only || only === key) && flag;
  const ORD = ['1st', '2nd', '3rd', '4th'];

  function theme(t) {
    const r = document.documentElement.style;
    r.setProperty('--font', t.fontFamily); r.setProperty('--size', t.fontSize + 'px'); r.setProperty('--text', t.text);
    r.setProperty('--bg', t.background); r.setProperty('--accent', t.accent); r.setProperty('--win', t.win);
    r.setProperty('--loss', t.loss); r.setProperty('--riichi', t.riichi);
  }
  function mins(since) { if (!since) return ''; const m = Math.floor((Date.now() - since) / 60000); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`; }

  function render() {
    if (!last) return;
    const { state: s, vars: v } = last;
    $('status').classList.toggle('hidden', !show('status', opts.showStatus) || (!s.inGame && !s.lastResult));
    $('mode').textContent = s.inGame ? v.mode : 'Last game';
    const p = s.inGame ? s.place : s.lastResult;
    $('place').textContent = p ? ORD[p - 1] : 'In a match';
    $('place').className = 'place' + (p ? ' p' + p : '');
    $('time').textContent = s.inGame && s.since ? mins(s.since) : '';
    $('session').classList.toggle('hidden', !show('session', opts.showSession) || !v.games);
    $('session').textContent = `Session: ${v.games} games · avg ${v.avgPlace} · ${v.first}/${v.second}/${v.third}/${v.fourth}`;
  }

  const STYLE = { my_win_ron: 'win', my_win_tsumo: 'win', my_yakuman: 'win big', took_lead: 'win', dealt_in: 'loss', lost_lead: 'loss', my_riichi: 'riichi', opponent_riichi: 'riichi', game_end_1: 'win big', game_end_4: 'loss' };
  function toast(key, text) {
    if (!show('feed', opts.showFeed) || !text) return;
    const t = document.createElement('div');
    t.className = 'toast ' + (STYLE[key] ?? ''); t.textContent = text;
    $('feed').prepend(t);
    while ($('feed').children.length > opts.feedMax) $('feed').lastChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 500); }, opts.feedSeconds * 1000);
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/overlay`);
    ws.onmessage = (m) => {
      const d = JSON.parse(m.data);
      if (d.kind === 'state') { opts = d.overlay; theme(opts.theme); last = d; render(); }
      else if (d.kind === 'event') toast(d.key, d.text);
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
  setInterval(render, 15000);
</script>
</body>
</html>
